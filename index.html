<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GradeUp — Rescate de datos</title>
<style>
  body{font:16px -apple-system,Helvetica,Arial,sans-serif;max-width:560px;margin:0 auto;padding:20px;color:#1a1916;background:#f7f6f2}
  h1{font-size:20px} .box{background:#fff;border:1px solid #e8e6df;border-radius:10px;padding:14px;margin:14px 0}
  button{font:inherit;padding:12px 16px;border-radius:8px;border:0;background:#1a1916;color:#fff;width:100%;margin-top:8px}
  textarea{width:100%;height:120px;font:12px monospace;margin-top:8px;box-sizing:border-box}
  .ok{color:#27500a} .err{color:#a32}
</style></head><body>
<h1>GradeUp — Rescate de datos</h1>
<p>Esta página solo <b>lee</b> tus datos guardados en este navegador. No modifica ni borra nada.</p>
<div class="box" id="info">Leyendo…</div>
<button id="dl" hidden>Descargar respaldo (.json)</button>
<button id="show" hidden style="background:#6b6860">Mostrar texto para copiar</button>
<textarea id="txt" hidden readonly></textarea>
<script>
(function(){
  var info=document.getElementById('info'),dl=document.getElementById('dl'),show=document.getElementById('show'),txt=document.getElementById('txt');
  var raw=null;
  try{raw=localStorage.getItem('gradeup_state');}catch(e){}
  if(!raw){info.innerHTML='<span class="err">No encontré datos de GradeUp en este navegador.</span><br>Ábrela desde el mismo navegador y la misma dirección donde usas GradeUp (https://grayvince.github.io/…). Si la usas desde un icono en la pantalla de inicio, prueba también desde Safari.';return;}
  var s;try{s=JSON.parse(raw);}catch(e){info.innerHTML='<span class="err">Los datos existen pero no se pueden leer.</span> Descarga igualmente el respaldo.';s={};}
  var grupos=s.importedGroups||[],alum=grupos.reduce(function(n,g){return n+(g.alumnos||[]).length},0);
  var notas=Object.keys(s.grades||{}).filter(function(k){return s.grades[k]&&s.grades[k].score!=null}).length;
  info.innerHTML='<span class="ok">Datos encontrados.</span><br>Grupos: <b>'+grupos.length+'</b> · Alumnos: <b>'+alum+'</b><br>Rúbricas guardadas: <b>'+(s.savedRubrics||[]).length+'</b><br>Notas en curso: <b>'+notas+'</b> · Evaluaciones archivadas: <b>'+(s.gradingHistory||[]).length+'</b>';
  var out=JSON.stringify({app:'GradeUp',formato:'v1.2-raw',exportado:new Date().toISOString(),estado:s},null,2);
  dl.hidden=show.hidden=false;
  dl.onclick=function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'application/json'}));a.download='GradeUp_respaldo_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();};
  show.onclick=function(){txt.hidden=false;txt.value=out;txt.select();};
})();
</script></body></html>
